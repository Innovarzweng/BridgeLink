version: 0.2

env:
  variables:
    S3_BUCKET: "innovar-codebuild"
    S3_KEY: "bridgelink/bridgelink_clean_code.zip"
    INSTANCE_ID: "i-081a9ddfb4dffd83f"
    REGION: "us-east-1"
    PRODUCT_NAME: "bridgelink"

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Installing Ant, Zip, and AWS CLI..."
      - export JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8"
      - yum install -y ant zip awscli

  build:
    commands:
      - echo "Building project with Ant (UTF-8 encoding)..."
      - ant -f server/mirth-build.xml -Dfile.encoding=UTF-8

  post_build:
    commands:
      - echo "Zipping contents of server/setup folder (without parent dirs)..."
      - cd server/setup && zip -r ../../output.zip . && cd ../..

      - echo "Uploading zip to S3 bucket..."
      - aws s3 cp output.zip s3://$S3_BUCKET/$S3_KEY --region $REGION

      - echo "Retrieving Install4j license key from Parameter Store..."
      - INSTALL4J_LICENSE_KEY=$(aws ssm get-parameter --name "/bridgelink/install4j_license_key" --with-decryption --region $REGION --query "Parameter.Value" --output text)

      - echo "Triggering SSM command on Windows EC2 instance..."

      - |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunPowerShellScript" \
          --comment "Download zip and run install4jc, then re-upload output" \
          --timeout-seconds 1800 \
          --parameters "{\"commands\":[
            \"\$bucket = '$S3_BUCKET'\",
            \"\$key = '$S3_KEY'\",
            \"\$region = '$REGION'\",
            \"\$zip = 'C:\\\\Users\\\\Administrator\\\\output.zip'\",
            \"\$product_name = '$PRODUCT_NAME'\",
            \"\$outzip = 'C:\\\\Users\\\\Administrator\\\\${PRODUCT_NAME}_codebuild_output.zip'\",
            \"\$install4j_license_key = '$INSTALL4J_LICENSE_KEY'\",
            

            \"if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {\",
            \"  Write-Host 'Installing AWS CLI...'\",
            \"  Invoke-WebRequest https://awscli.amazonaws.com/AWSCLIV2.msi -OutFile C:\\\\Windows\\\\Temp\\\\AWSCLIV2.msi\",
            \"  Start-Process msiexec.exe -ArgumentList '/i C:\\\\Windows\\\\Temp\\\\AWSCLIV2.msi /quiet' -Wait\",
            \"  \$env:Path += ';C:\\\\Program Files\\\\Amazon\\\\AWSCLIV2\\\\'\",
            \"}\",

            \"Write-Host 'Downloading setup archive from S3...'\",
            \"aws s3 cp 's3://$S3_BUCKET/$S3_KEY' \$zip --region \$region --only-show-errors\",
            \"if (!(Test-Path \$zip)) { throw 'S3 download failed' }\",

            \"Expand-Archive -Path \$zip -DestinationPath 'C:\\\\Users\\\\Administrator\\\\${product_name}_work_station\\\\bridgelink_setup_clean' -Force\",

            \"Write-Host 'Running install4jc...'\",
            \"& 'C:\\\\Program Files\\\\install4j11\\\\bin\\\\install4jc.exe' -L \$install4j_license_key -d 'C:\\\\Users\\\\Administrator\\\\${product_name}_work_station\\\\bridgelink_output' 'C:\\\\Users\\\\Administrator\\\\${product_name}_work_station\\\\bridgelink_config.install4j'\",

            \"Write-Host 'Zipping build output...'\",
            \"Compress-Archive -Path 'C:\\\\Users\\\\Administrator\\\\${product_name}_work_station\\\\bridgelink_output\\\\*' -DestinationPath \$outzip -Force\",

            \"Write-Host 'Uploading build output to S3...'\",
            \"aws s3 cp \$outzip 's3://innovar-codebuild/bridgelink/bridgelink_codebuild_output.zip' --region \$region --only-show-errors\"
          ]}" \
          --region "$REGION" \
          --query "Command.CommandId" \
          --output text)

        echo "SSM Command ID: $COMMAND_ID"

        echo "Waiting for SSM command to finish..."
        aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION"

        echo "Fetching SSM command output..."
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --region "$REGION" \
          --query "{Status:Status, StandardOutputContent:StandardOutputContent, StandardErrorContent:StandardErrorContent}" \
          --output text



artifacts:
  files:
    - output.zip
